services:
  app:
    build: .
    container_name: hw66-app
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/hw66
      SESSION_SECRET: docker-session-secret
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: node --watch src/server.js

  mongo:
    image: mongo:latest
    container_name: hw66-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
